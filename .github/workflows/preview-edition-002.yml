name: Prévisualiser l'édition 002 sans publier
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-edition-002.yml'
      - 'source/scripts/private-cycle.mjs'
      - 'source/test/workflow-schedules.test.mjs'
      - 'source/scripts/weekly-ranking.mjs'
      - 'source/scripts/recommendation-policy.mjs'
      - 'source/scripts/weekly-evidence.mjs'
      - 'source/scripts/observation-report.mjs'
      - 'source/scripts/editorial-endorsements.mjs'
      - 'source/editorial/live-archive.json'
      - 'source/test/editorial-endorsements.test.mjs'
      - 'source/test/incremental-discovery.test.mjs'
      - 'source/scripts/album-catalogues.mjs'
      - 'source/scripts/discovery.mjs'
      - 'source/scripts/discovery-feeds.mjs'
      - 'source/scripts/nova-mixes.mjs'
      - 'source/scripts/youtube-mixes.mjs'
      - 'source/test/youtube-mixes.test.mjs'
      - 'source/app/content.ts'
      - 'source/app/globals.css'
      - 'source/test/site-contract.test.mjs'
      - 'source/editorial/edition.mjs'
      - 'source/editorial/sources.json'
      - 'source/editorial/album-catalogues.json'
      - 'source/test/weekly.test.mjs'
      - 'source/test/discovery-sources.test.mjs'
      - 'source/test/edition-archives.test.mjs'
      - 'source/scripts/automation-policy.mjs'
      - 'source/app/journal.tsx'
      - 'source/public/art/mix-semaine.jpg'
      - 'art/mix-semaine.jpg'
      - 'source/test/editorial.test.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: bonnes-ondes-private-cycle
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview-edition-002]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Test a *different* 100k+ view soul/R&B YouTube mix, and inspect other Nova podcasts. No publication.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm test && npm run typecheck
        working-directory: source
      - name: Préparer les recommandations réelles et le site témoin
        working-directory: source
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BONNES_ONDES_RUNNER_TOKEN: ${{ secrets.BONNES_ONDES_RUNNER_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          AUTO_PUBLISH_ENABLED: 'false'
          BONNES_ONDES_PREVIEW_DIR: ${{ runner.temp }}/bonnes-ondes-preview
          BONNES_ONDES_PREVIEW_EXCLUDE_YOUTUBE_IDS: 'K6en74gqBSM'
          BONNES_ONDES_OBSERVATION_DIR: ${{ runner.temp }}/bonnes-ondes-observation
        run: node scripts/private-cycle.mjs observe
      - name: Contrôler les choix réels avant toute prévisualisation
        working-directory: source
        env:
          BONNES_ONDES_OBSERVATION_DIR: ${{ runner.temp }}/bonnes-ondes-observation
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {excludesJazz,editorialEndorsement,isFreshMusicMix,isNtsMix,isNovaMix,isYouTubeMix} from './scripts/recommendation-policy.mjs';
          const report=JSON.parse(readFileSync(join(process.env.BONNES_ONDES_OBSERVATION_DIR,'recommendations.json'),'utf8'));
          const rows=Object.values(report.selected).flat();
          if(!report.complete || rows.some(item=>excludesJazz(item))) throw new Error('Sélection incomplète ou jazz détecté.');
          if(report.selected.albums.length!==3 || report.selected.albums.some(item=>!editorialEndorsement({...item,format:'Album'})))
            throw new Error('Trois albums avec recommandations éditoriales explicites et vérifiables obligatoires.');
          if(report.selected.albums.some(item=>!item.artwork || !item.artwork.startsWith('https://')
            || !/^https:\/\/open\.spotify\.com\/album\/[a-zA-Z0-9]{22}$/.test(item.url)))
            throw new Error('Chaque album doit afficher sa pochette officielle et pointer vers Spotify.');
          const lives=report.selected.live;
          const creators=lives.map(item=>item.creator?.normalize('NFKD').toLowerCase().trim()).filter(Boolean);
          if(lives.length!==3 || creators.length!==3 || new Set(creators).size!==3) throw new Error('Trois artistes différents sont obligatoires pour les lives.');
          const studios=lives.map(item=>item.sourceId??item.source);
          if(new Set(studios).size!==3) throw new Error('Trois formats ou diffuseurs live différents sont requis.');
          const djSets=[...report.selected.nts,...report.selected.nova,...report.selected.youtube];
          const date=report.generatedAt.slice(0,10);
          if(djSets.length!==3 || djSets.some(item=>!isFreshMusicMix({...item,format:'Radio show'},report.startsOn,date)))
            throw new Error('Trois vrais mixes musicaux récents obligatoires.');
          if(report.selected.nts.length!==1 || !isNtsMix({...report.selected.nts[0],format:'Radio show'}))
            throw new Error('Un mix NTS est obligatoire.');
          if(report.selected.nova.length!==1 || !isNovaMix({...report.selected.nova[0],format:'Radio show'}))
            throw new Error('Un mix Nova Danse est obligatoire.');
          if(report.selected.youtube.some(x=>x.embed?.id==='K6en74gqBSM')) throw new Error('Le mix de comparaison doit être différent de Nia.');
          if(report.selected.youtube.length!==1 || !isYouTubeMix({...report.selected.youtube[0],format:'Radio show'})
             || report.selected.youtube[0].viewCount<100000 || report.selected.youtube[0].subscriberCount<2500
             || report.selected.youtube[0].mixStyleVerified!==true
             || !['rnb','soul','blues','pop','light-house','funk'].includes(report.selected.youtube[0].mixStyle))
            throw new Error('Un mix YouTube R&B/soul/blues/pop/house douce avec 100000 vues vérifiées est obligatoire.');
          if(new Set(djSets.map(item=>item.sourceId)).size!==3) throw new Error('Trois sources de mixes distinctes obligatoires.');
          console.log(JSON.stringify({albums:report.selected.albums.map(x=>x.title),
            mixes:djSets.map(x=>({title:x.title,date:x.date,source:x.source,views:x.viewCount,subscribers:x.subscriberCount})),
            live:lives.map(x=>({artist:x.creator,format:x.source}))}));
          JS
      - name: Mettre en ligne seulement la route de prévisualisation
        env:
          PREVIEW_DIR: ${{ runner.temp }}/bonnes-ondes-preview
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PREVIEW_DIR/previsualisation/2026-11-23/index.html"
          test -d "$PREVIEW_DIR/_next"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          mkdir -p previsualisation/2026-11-23 _next
          cp "$PREVIEW_DIR/previsualisation/2026-11-23/index.html" previsualisation/2026-11-23/index.html
          cp -R "$PREVIEW_DIR/_next/." _next/
          touch .nojekyll
          git add previsualisation/2026-11-23/index.html _next .nojekyll
          git diff --cached --quiet && exit 0
          git config user.name 'Bonnes Ondes'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Prévisualisation isolée de l’édition 002'
          git push origin HEAD:main
      - name: Actualiser GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --output /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-preview-edition-002
          path: ${{ runner.temp }}/bonnes-ondes-observation/
          if-no-files-found: ignore
          retention-days: 7
