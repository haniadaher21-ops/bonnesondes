name: Vérifier les automatisations
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/discover.yml'
      - '.github/workflows/autonomous.yml'
      - '.github/workflows/weekly.yml'
      - '.github/workflows/daily-ci.yml'
      - 'source/test/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm test && npm run typecheck

      - name: Vérifier les nouvelles sources sur les services réels
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'editorial/expand-mix-live-sources'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {discover} from './scripts/discovery.mjs';
          import {verifyLives} from './scripts/weekly-evidence.mjs';
          import {collectYouTubeMixes,targetedMixChannels} from './scripts/youtube-mixes.mjs';
          import {nextEditionMonday} from './scripts/weekly-ranking.mjs';
          import {parisDate} from './editorial/edition.mjs';
          const key=process.env.YOUTUBE_DATA_API_KEY;
          assert.ok(key,'Clé YouTube absente');
          const now=new Date(), today=parisDate(now), startsOn=nextEditionMonday(now);
          const ids=['blogotheque','mahogany','audiotree','arte-concert','npr-tiny-desk','fip-tape'];
          const sources=JSON.parse(readFileSync('editorial/sources.json','utf8')).filter(s=>ids.includes(s.id));
          const channels=[...sources.filter(s=>s.channelId).map(s=>({id:s.channelId,name:s.name})),...targetedMixChannels.map(s=>({id:s.channelId,name:s.name}))];
          const response=await fetch('https://www.googleapis.com/youtube/v3/channels?'+new URLSearchParams({part:'snippet',id:channels.map(c=>c.id).join(',')}),{headers:{'x-goog-api-key':key},signal:AbortSignal.timeout(15000)});
          assert.ok(response.ok,'YouTube channels HTTP '+response.status);
          const verified=(await response.json()).items;
          for(const c of channels){
            const actual=verified.find(x=>x.id===c.id);
            assert.ok(actual,'Chaîne introuvable: '+c.name);
            console.log('Chaîne confirmée:',c.name,'=>',actual.snippet.title,actual.snippet.customUrl);
          }
          const result=await discover({sources,now});
          for(const s of result.sources)console.log('Collecte:',s.sourceId,s.status,'candidats:',result.candidates.filter(x=>x.sourceId===s.sourceId).length,'erreurs:',JSON.stringify(s.errors??[]));
          console.log('Candidats réels:',JSON.stringify(result.candidates.map(x=>({source:x.sourceId,title:x.title,url:x.url}))));
          const lives=await verifyLives(result.candidates,sources,key);
          console.log('Lives vérifiés:',lives.status,JSON.stringify(lives.items.map(x=>({source:x.sourceId,title:x.title,creator:x.creator,minutes:x.minutes}))));
          const mix=await collectYouTubeMixes({startsOn,today,key});
          console.log('Mixes:',mix.status,'trouvés:',mix.found,'éligibles:',mix.eligible,'requêtes:',mix.queries);
          console.log('Mixes vérifiés:',JSON.stringify(mix.items.map(x=>({source:x.source,title:x.title,views:x.viewCount,style:x.mixStyle}))));
          for(const source of sources.filter(s=>s.format==='Live session'))assert.ok(lives.items.some(x=>x.sourceId===source.id&&x.creator),'Aucun live avec artiste identifié: '+source.id);
          assert.ok(mix.status==='ok','Collecte YouTube incomplète');
          assert.ok(result.candidates.some(x=>x.sourceId==='fip-tape'),'Aucun épisode FIP Tape confirmé');
          JS

      - name: Sonder les tracklists réelles sans toucher aux données privées
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'editorial/mix-tracklists'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {discover} from './scripts/discovery.mjs';
          import {enrichRadioTracklists} from './scripts/mix-tracklists.mjs';
          import {collectYouTubeMixes} from './scripts/youtube-mixes.mjs';
          import {nextEditionMonday} from './scripts/weekly-ranking.mjs';
          import {parisDate} from './editorial/edition.mjs';
          const sources=JSON.parse(readFileSync('editorial/sources.json','utf8')).filter(s=>['nts-dont-trip','nts-floating-points','fip-tape'].includes(s.id));
          const now=new Date();
          const result=await discover({sources,now});
          const {items,diagnostics}=await enrichRadioTracklists(result.candidates,{now});
          console.log('Tracklists radio:',JSON.stringify(diagnostics));
          console.log('Tracklists épisodes:',JSON.stringify(items.map(x=>({source:x.sourceId,title:x.title,status:x.tracklist?.status,tracks:x.tracklist?.tracks?.length,example:x.tracklist?.tracks?.slice(0,2),url:x.tracklist?.sourceUrl}))));
          assert.ok(items.some(x=>x.sourceId?.startsWith('nts-')&&x.tracklist?.status==='available'),'Aucune tracklist NTS confirmée');
          const mixes=await collectYouTubeMixes({startsOn:nextEditionMonday(now),today:parisDate(now),key:process.env.YOUTUBE_DATA_API_KEY});
          console.log('Tracklists YouTube:',JSON.stringify({status:mixes.status,eligible:mixes.items.length,available:mixes.items.filter(x=>x.tracklist?.status==='available').map(x=>({title:x.title,count:x.tracklist.tracks.length,example:x.tracklist.tracks.slice(0,2)}))}));
          assert.ok(items.some(x=>x.sourceId==='fip-tape'&&x.tracklist?.status==='available'),'Aucune tracklist FIP Tape confirmée');
          JS

      - name: Comparer les classements sur de vrais mixes et le profil synchronisé
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'editorial/tracklist-affinity'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BONNES_ONDES_RUNNER_TOKEN: ${{ secrets.BONNES_ONDES_RUNNER_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {discover} from './scripts/discovery.mjs';
          import {enrichRadioTracklists} from './scripts/mix-tracklists.mjs';
          import {collectYouTubeMixes} from './scripts/youtube-mixes.mjs';
          import {weeklyShortlist} from './scripts/weekly-ranking.mjs';
          import {editionForCycle} from './scripts/automation-policy.mjs';
          import {parisDate,editionItems} from './editorial/edition.mjs';
          import {legacyEdition,legacyItems,publishedFile,readJson} from './scripts/editorial-files.mjs';
          import {readRunnerProfile} from './private-sync/client.mjs';
          import {normalizeTasteProfile} from './editorial/taste-profile.mjs';
          const now=new Date(),startsOn=editionForCycle(now);
          const remote=await readRunnerProfile({url:process.env.SUPABASE_URL,publicKey:process.env.SUPABASE_PUBLISHABLE_KEY},process.env.BONNES_ONDES_RUNNER_TOKEN);
          const profile=normalizeTasteProfile(remote.profile);
          const sources=JSON.parse(readFileSync('editorial/sources.json','utf8')).filter(s=>s.method==='nts-episodes'||s.id==='fip-tape'||s.provider==='Radio Nova');
          const result=await discover({sources,now});
          const {items}=await enrichRadioTracklists(result.candidates,{now});
          const mixes=await collectYouTubeMixes({startsOn,today:parisDate(now),key:process.env.YOUTUBE_DATA_API_KEY,profile});
          const earlier=[legacyEdition,...readJson(publishedFile)];
          const options={candidates:[...items,...mixes.items],profile,earlier,catalog:legacyItems,startsOn,now};
          const before=weeklyShortlist({...options,tracklistWeight:0}),after=weeklyShortlist(options);
          const rows=after.rankings.filter(x=>x.item.format==='Radio show');
          const summary={profileArtists:profile.favoriteArtists.length,eligibleMixes:rows.length,tracklists:rows.filter(x=>x.tracklistAffinity.available).length,boosted:rows.filter(x=>x.tracklistAffinity.points>0).length,lowered:rows.filter(x=>x.tracklistAffinity.points<0).length,groups:Object.fromEntries(['nts','nova','youtube','fip'].map(k=>[k,{before:before.selected[k].map(x=>x.item.title),after:after.selected[k].map(x=>x.item.title),changed:before.selected[k].map(x=>x.item.id).join('|')!==after.selected[k].map(x=>x.item.id).join('|')}]))};
          console.log('Affinité réelle (agrégée):',JSON.stringify(summary));
          assert.ok(summary.tracklists>0,'Aucune tracklist éligible pour la comparaison');
          assert.equal(before.rankings.length,after.rankings.length);
          assert.ok(after.rankings.every(x=>Number.isFinite(x.score)));
          JS

      - name: Build et sondage public MusicBrainz / ListenBrainz
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'affinity-private-pilot'
        run: |
          npm run build
          node scripts/check-public-artist-metadata.mjs

      - name: Vérifier la résilience des API musicales
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'artist-api-resilience'
        run: |
          npm run build
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {enrichPublicArtists} from './scripts/public-artist-metadata.mjs';
          const names=['Toro y Moi','Lorenzo Senni','Atlas Sound','Donato Dozzy'];
          const cache=new Map(),backoff={},diagnostics={};
          const rows=await enrichPublicArtists(names,{cache,backoff,diagnostics,limit:4});
          console.log('PUBLIC_API_TEST '+JSON.stringify({results:[...rows].map(([artist,row])=>({artist,status:row.status,neighbors:row.neighbors?.length??0})),diagnostics}));
          assert.equal(rows.size,names.length);
          for(const row of rows.values())if(row.status==='verified')assert.ok(row.mbid&&Array.isArray(row.neighbors));
          const again={};
          await enrichPublicArtists(names,{cache,backoff,limit:0,diagnostics:again});
          assert.equal(again.requests,0);
          console.log('PUBLIC_CACHE_TEST '+JSON.stringify(again));
          JS

      - name: Retester les affinités publiques
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'affinity-retest-2026-11-27'
        run: node scripts/retest-public-affinity.mjs
