name: Tester les flux HLS de FIP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fip-hls-check.yml'
      - 'source/scripts/check-fip-hls.mjs'
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/scripts/check-fip-hls.mjs
