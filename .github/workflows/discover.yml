name: Collecte quotidienne des découvertes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
      timezone: Europe/Paris

concurrency:
  group: bonnes-ondes-private-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.DAILY_COLLECTION_PAUSED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - name: Collecter et conserver les découvertes privées
        run: node scripts/private-cycle.mjs collect
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BONNES_ONDES_RUNNER_TOKEN: ${{ secrets.BONNES_ONDES_RUNNER_TOKEN }}
          AUTO_PUBLISH_ENABLED: 'false'
      - name: Signaler un échec sans publier
        if: failure()
        run: echo '::error::Collecte quotidienne interrompue ; vérifier le profil, Supabase et les sources. Aucune édition publiée.'
