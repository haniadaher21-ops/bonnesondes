name: Découvrir des candidats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run discover
      - uses: actions/upload-artifact@v4
        with:
          name: candidats-bonnes-ondes
          path: source/.discovery/
          include-hidden-files: true
          if-no-files-found: error
