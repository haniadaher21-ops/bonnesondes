name: Examiner les sources radio campus
on:
  pull_request:
    paths:
      - 'source/scripts/probe-campus-sources.mjs'
      - '.github/workflows/probe-campus-sources.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/scripts/probe-campus-sources.mjs