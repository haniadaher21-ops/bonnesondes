name: Vérifier les sources de titres radio
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/scripts/probe-nowplaying.mjs'
      - '.github/workflows/radio-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les métadonnées publiques Nova et FIP
        run: node source/scripts/probe-nowplaying.mjs
