name: Diagnostiquer les métadonnées radios
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/radio-metadata-probe.yml'
      - 'source/scripts/test-radio-metadata-sources.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/scripts/test-radio-metadata-sources.mjs
