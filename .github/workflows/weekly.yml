name: Préparer le brouillon hebdomadaire

on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * 0'
      timezone: Europe/Paris

permissions:
  contents: read

concurrency:
  group: bonnes-ondes-private-cycle
  cancel-in-progress: false

jobs:
  shortlist:
    # Owner-approved weekly draft only; separate from disabled daily collection.
    # Pause scheduled runs with the WEEKLY_DRAFT_PAUSED Actions variable.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.WEEKLY_DRAFT_PAUSED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - name: Vérifier le brouillon pondéré en privé
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BONNES_ONDES_RUNNER_TOKEN: ${{ secrets.BONNES_ONDES_RUNNER_TOKEN }}
          AUTO_PUBLISH_ENABLED: 'false'
          BONNES_ONDES_WEIGHTED_OBSERVE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BONNES_ONDES_WEIGHTED_RELEASE: 'true'
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {privateCycle} from './scripts/private-cycle.mjs';
          const quiet=()=>{};
          console.log=quiet; console.warn=quiet; console.error=quiet; console.info=quiet; console.debug=quiet;
          try {
            const result=await privateCycle({mode:'observe'});
            if(result.status!=='observe'||result.complete!==true)throw Error('Incomplete draft');
            process.stdout.write('Brouillon pondéré complet, build validé en privé.\n');
          }catch{
            process.stdout.write('Brouillon pondéré bloqué ; aucune publication.\n');
            process.exitCode=1;
          }
          JS
      - name: Signaler un brouillon bloqué
        if: failure()
        run: |
          echo '::error::Brouillon hebdomadaire incomplet ou indisponible ; aucune édition publiée.'
          echo 'Le brouillon n’a pas passé tous les contrôles. Les détails restent dans le brouillon privé.' >> "$GITHUB_STEP_SUMMARY"
